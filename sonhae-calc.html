<div id="pwaBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#2563eb;color:#fff;padding:9px 12px;font-size:13px;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.2)">
  <span style="font-size:18px">📲</span>
  <span id="pwaMsg" style="flex:1;line-height:1.3">홈 화면에 추가하면 앱처럼 쓸 수 있어요!</span>
  <button id="pwaInstall" style="background:#fff;color:#2563eb;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap">설치</button>
  <button id="pwaClose" style="background:transparent;color:#fff;border:none;font-size:18px;padding:0 4px;line-height:1">✕</button>
</div>
<script>
(function(){
  var KEY='pwaBannerDismissed_sonhae';
  var deferredPrompt=null;
  var banner=document.getElementById('pwaBanner');
  var msg=document.getElementById('pwaMsg');
  var btnInstall=document.getElementById('pwaInstall');
  var btnClose=document.getElementById('pwaClose');
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
  function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
  function dismissed(){try{return localStorage.getItem(KEY)==='1';}catch(e){return false;}}
  function dismiss(){try{localStorage.setItem(KEY,'1');}catch(e){}banner.style.display='none';}
  function show(){banner.style.display='flex';}
  if(!isStandalone()&&!dismissed()){
    if(isiOS()){
      // iOS: beforeinstallprompt 미지원 -> 공유 버튼 안내
      msg.textContent='홈 화면에 추가: 하단 공유(⬆) → "홈 화면에 추가"';
      btnInstall.style.display='none';
      show();
    }
    window.addEventListener('beforeinstallprompt',function(e){
      e.preventDefault();deferredPrompt=e;
      if(!isStandalone()&&!dismissed())show();
    });
  }
  btnInstall.addEventListener('click',function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(r){
        if(r.outcome==='accepted')dismiss();
        deferredPrompt=null;
      });
    }
  });
  btnClose.addEventListener('click',dismiss);
  window.addEventListener('appinstalled',dismiss);
})();
</script>

        if(!sv._caseId) sv._caseId=newCaseId();

function tabStatus(i){
  var ivc=calcInsurance();
  var hasRooms=rooms.some(function(r){return r.w&&r.d;});
  switch(i){
    case 0: return ivc&&!ivc.error?'ok':(sv.iv_btKey&&(sv.iv_strId||sv.iv_area)?'part':'');
    case 1: return hasRooms?(rooms.every(function(r){return r.w&&r.d;})?'ok':'part'):'';
    case 2: return windows.some(function(w){return w.w&&w.h;})?'ok':(hasRooms?'auto':'');
    case 3: case 4: case 5: case 6: case 7: return hasRooms?'auto':'';
    case 8: return hasRooms?'ok':'';
  }
  return '';
}

// ── 자동 유도값 (입력이 비어 있을 때 쓰는 값) ──
function autoDoorCnt(){
  // 여닫이문: 안방·침실·드레스룸·다용도실·세탁실·창고 + 욕실 각 1개소
  return rooms.filter(function(r){ return r.name&&/안방|침실|드레스룸|다용도|세탁실|창고|욕실/.test(r.name); }).length;
}
function effDoorCnt(){ return sv.door_cnt===''||sv.door_cnt===undefined?autoDoorCnt():PI(sv.door_cnt); }
function autoLKRooms(){ return rooms.filter(function(r){ return r.name&&r.w&&r.d&&/거실|주방|식당/.test(r.name); }); }
function autoLKExpr(){
  // 거실·주방 벽 둘레식: (w+d)*2 합 (수동 덧셈식이 없을 때 벽체도배에 사용)
  return autoLKRooms().map(function(r){ return '('+R2(r.w)+'+'+R2(r.d)+')*2'; }).join('+');
}
function autoBaseDeductExpr(){
  // 걸레받이 차감: 여닫이문 0.9×n + 현관문 폭 + 중문 폭
  var parts=[]; var n=effDoorCnt();
  if(n>0) parts.push('0.9*'+n);
  var ew=PF(sv.entry_door_w||'1000')/1000; if(ew>0) parts.push(R2(ew));
  if(sv.middle_door){ var mw=PF(sv.middle_door_w||'1500')/1000; if(mw>0) parts.push(R2(mw)); }
  return parts.join('+');
}
function effLKStr(){
  var s=(sv.wall_lk_manual||'').trim()||(sv.molding_manual||'').trim();
  return s||autoLKExpr();
}
function effBaseDeductStr(){
  var s=(sv.base_door_extra||'').trim();
  return s||autoBaseDeductExpr();
}
function updateAutoHints(){
  var h;
  h=document.getElementById('door-auto-hint');
  if(h){ var a=autoDoorCnt(); h.innerHTML=(sv.door_cnt===''?'비워두면 실 구성 기준 자동 <b>'+a+'개소</b> 적용':'직접 입력 '+PI(sv.door_cnt)+'개소 (자동 추천 '+a+'개소)'); }
  h=document.getElementById('lk-auto-hint');
  if(h){ var lk=(sv.wall_lk_manual||'').trim()||(sv.molding_manual||'').trim(); h.innerHTML=lk?'입력식 사용: <b>'+lk+'</b>':(autoLKExpr()?'비워두면 거실·주방·식당 둘레 자동: <b>'+autoLKExpr()+'</b> = '+R2(safeEval(autoLKExpr()))+'m':'거실·주방 실을 추가하면 둘레가 자동 산정됩니다'); }
  h=document.getElementById('bb-auto-hint');
  if(h){ var bb=(sv.base_door_extra||'').trim(); h.innerHTML=bb?'입력식 사용: <b>'+bb+'</b> = '+R2(safeEval(bb))+'m':'비워두면 자동 차감식: <b>'+(autoBaseDeductExpr()||'0')+'</b> = '+R2(safeEval(autoBaseDeductExpr()))+'m (여닫이문 0.9×'+effDoorCnt()+' + 현관문'+(sv.middle_door?' + 중문':'')+')'; }
}

function updateLive(){

  try{ var r=runCalc(); f.textContent=FMT(r.final)+'원'; v.textContent=r.ins.unit_v>0?FMT(r.ins.unit_v)+'원':'미산정'; }
  catch(e){ f.textContent='-'; }

function updateMoldingHint(){
  var el=document.getElementById('molding-hint'); if(!el) return;
  var lives=rooms.filter(function(r){return r.name&&r.w&&r.d&&r.name.indexOf('욕실')<0&&BALCONIES.indexOf(r.name)<0;});
  var baths=rooms.filter(function(r){return r.name&&r.w&&r.d&&r.name.indexOf('욕실')>=0;});
  var LK=/거실|주방|식당/;
  var auto=lives.filter(function(r){return !LK.test(r.name);}).concat(baths).reduce(function(s,r){return s+2*(parseFloat(r.w)+parseFloat(r.d));},0);
  var manual=safeEval(sv.molding_manual);
  var lkAuto=lives.filter(function(r){return LK.test(r.name);}).reduce(function(s,r){return s+2*(parseFloat(r.w)+parseFloat(r.d));},0);
  if(manual>0) el.innerHTML='방·욕실 둘레합: '+auto.toFixed(2)+'m + 거실·주방 입력식: '+manual.toFixed(2)+'m = <b>합계: '+(auto+manual).toFixed(2)+'m</b>';
  else el.innerHTML='방·욕실 둘레합: '+auto.toFixed(2)+'m + 거실·주방 실 둘레 자동: '+lkAuto.toFixed(2)+'m = <b>합계: '+(auto+lkAuto).toFixed(2)+'m</b> — 거실·주방 통합구간은 도면 벽면길이 덧셈식으로 입력하면 그 값으로 대체됩니다';
}

var ROOM_TEMPLATES={
  '아파트 4룸(대형)':['현관','거실','식당+주방','안방','드레스룸','침실1','침실2','침실3','욕실1(안방)','욕실2','전면발코니1','후면발코니1','다용도실'],
  '아파트 3룸(84㎡형)':['현관','거실','식당+주방','안방','침실1','침실2','욕실1(안방)','욕실2','전면발코니1','후면발코니1','다용도실'],
  '아파트 2룸(59㎡형)':['현관','거실','식당+주방','안방','침실1','욕실1(안방)','욕실2','전면발코니1','후면발코니1'],
  '원룸·오피스텔':['현관','거실','주방','욕실1(안방)','발코니1']
};
function applyRoomTemplate(k){
  var list=ROOM_TEMPLATES[k]||[]; var added=0;
  list.forEach(function(name){ if(!rooms.find(function(r){return r.name===name;})){ rooms.push({name:name,w:'',d:''}); added++; } });
  render(1);
  if(added){ var first=document.querySelector('.rw[value=""]'); if(first) first.focus(); }
}
function safeEval(expr){
  if(!expr)return 0;
  var s=String(expr).replace(/[×x]/g,'*').replace(/\s/g,'');
  if(!/^[0-9.+\-*/()]*$/.test(s))return 0;  // 숫자·연산자만 허용
  try{ var v=Function('"use strict";return ('+s+')')(); return (typeof v==='number'&&isFinite(v))?v:0; }catch(e){ return 0; }
}
function roomArea(r){
  var base=(parseFloat(r.w)||0)*(parseFloat(r.d)||0);
  var ex=safeEval(r.extra);
  return base+ex;
}
function roomAreaBasis(r){
  // 산출근거용: "5.40*3.90+1.20*0.80" 형태
  var base=(r.w&&r.d)?(parseFloat(r.w).toFixed(2)+'*'+parseFloat(r.d).toFixed(2)):'';
  var ex=(r.extra&&safeEval(r.extra)>0)?String(r.extra).replace(/[×x]/g,'*').replace(/\s/g,''):'';
  return ex?(base+'+'+ex):base;
}
function attachRoomEvents(){
  document.querySelectorAll('.rw').forEach(function(inp){
    inp.oninput=function(){ rooms[+inp.dataset.i].w=inp.value; calcRoom(+inp.dataset.i); onChange(); };
  });
  document.querySelectorAll('.rd').forEach(function(inp){
    inp.oninput=function(){ rooms[+inp.dataset.i].d=inp.value; calcRoom(+inp.dataset.i); onChange(); };
  });
  document.querySelectorAll('.rx').forEach(function(inp){
    inp.oninput=function(){ rooms[+inp.dataset.i].extra=inp.value; calcRoom(+inp.dataset.i); onChange(); };
  });
  // Enter → 다음 치수칸 (가로→세로→다음 실 가로)
  var seq=[]; document.querySelectorAll('.rw,.rd').forEach(function(el){ seq.push(el); });
  seq.forEach(function(el,i){
    el.setAttribute('inputmode','decimal'); el.setAttribute('enterkeyhint',i<seq.length-1?'next':'done');
    el.onkeydown=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); var nx=seq[i+1]; if(nx){ nx.focus(); nx.select(); } else el.blur(); } };
  });
}

// ── ③ 창호 ──
// 실별 창 칸 만들기: 위치·종류만 채우고 규격(폭×높이)은 비워 둠 — 창호는 현장마다 달라 항상 실측 입력
var WIN_TYPE_BY_ROOM=[
  {re:/거실|안방|발코니/, type:'하이샤시미서기이중창'},
  {re:/침실|주방|식당|다용도|세탁|현관|복도/, type:'하이샤시미서기단창'}
];
function autoWindows(){
  var added=0;
  rooms.forEach(function(r){
    if(!r.name||/욕실|드레스룸|창고|세탁실/.test(r.name)) return;
    var def=WIN_TYPE_BY_ROOM.filter(function(d){return d.re.test(r.name);})[0]; if(!def) return;
    if(windows.some(function(w){return (w.locs||[]).indexOf(r.name)>=0;})) return;   // 이미 그 실 창호가 있으면 건너뜀
    windows.push({locs:[r.name],type:def.type,w:'',h:'',qty:1}); added++;
  });
  render(2);
  if(!added){ alert('추가할 실이 없습니다. (실별치수 탭에서 실을 먼저 추가하거나, 이미 모든 실에 창 칸이 있습니다)'); return; }
  var first=document.querySelector('.ww[value=""]'); if(first) first.focus();

function attachWinEvents(){
  document.querySelectorAll('.wlc').forEach(function(chk){
    chk.onchange=function(){ var i=+chk.dataset.wi,loc=chk.dataset.loc; if(chk.checked){ if(windows[i].locs.indexOf(loc)<0) windows[i].locs.push(loc); } else { windows[i].locs=windows[i].locs.filter(function(l){return l!==loc;}); } onChange(); };
  });
  document.querySelectorAll('.wts').forEach(function(sel){ sel.onchange=function(){ windows[+sel.dataset.wi].type=sel.value; onChange(); }; });
  document.querySelectorAll('.ww').forEach(function(inp){
    inp.setAttribute('inputmode','numeric');
    inp.oninput=function(){ windows[+inp.dataset.wi].w=inp.value; onChange(); };
    inp.onchange=function(){ splitCombo(inp); };
  });
  document.querySelectorAll('.wh').forEach(function(inp){ inp.setAttribute('inputmode','numeric'); inp.oninput=function(){ windows[+inp.dataset.wi].h=inp.value; onChange(); }; });
  document.querySelectorAll('.wq').forEach(function(inp){ inp.oninput=function(){ windows[+inp.dataset.wi].qty=parseInt(inp.value)||1; onChange(); }; });
  // Enter → 폭 → 높이 → 개소 → 다음 창 폭
  var seq=[]; document.querySelectorAll('.card').forEach(function(card){ card.querySelectorAll('.ww,.wh,.wq').forEach(function(el){ seq.push(el); }); });
  seq.forEach(function(el,i){
    el.setAttribute('enterkeyhint',i<seq.length-1?'next':'done');
    el.onkeydown=function(ev){
      if(ev.key!=='Enter') return;
      ev.preventDefault();
      var skip=(el.classList.contains('ww')&&splitCombo(el))?2:1;   // 폭×높이 한 번에 입력했으면 높이 칸 건너뜀
      var nx=seq[i+skip]; if(nx){ nx.focus(); nx.select(); } else el.blur();
    };
  });
}
// 폭 칸에 "2400x2200" / "2400*2200" 형태로 입력 → 폭·높이 분리 (Enter 또는 칸 이동 시)
function splitCombo(inp){
  var m=inp.value.match(/^\s*(\d+)\s*[xX×*]\s*(\d+)\s*$/); if(!m) return false;
  var i=+inp.dataset.wi; windows[i].w=m[1]; windows[i].h=m[2]; inp.value=m[1];
  var hh=document.querySelector('.wh[data-wi="'+i+'"]'); if(hh) hh.value=m[2];
  onChange(); return true;
}

  balcRooms.forEach(function(r){ if(wpChecks[r.name]===undefined) wpChecks[r.name]=false; });

    var area = r.w&&r.d ? (parseFloat(r.w)*parseFloat(r.d)).toFixed(2)+'&#13217;' : '면적 미입력';

  // 실별치수에서 만든 욕실을 자동으로 욕실 탭에 생성 (없는 것만 추가)
  var bathRoomNames = rooms.filter(function(r){return r.name&&r.name.indexOf('욕실')>=0;}).map(function(r){return r.name;});
  bathRoomNames.forEach(function(nm){
    if(!baths.find(function(b){return b.name===nm;})){
      baths.push({name:nm,bathtub:true,shower:false,tiles:true});
    }
  });
  // 실별치수에서 삭제된 욕실은 욕실 탭에서도 제거 (수동 추가분은 유지)
  baths = baths.filter(function(b){
    return bathRoomNames.indexOf(b.name)>=0 || b._manual===true;
  });

  var autoNote = bathRoomNames.length ? '<div style="font-size:11px;color:#2563eb;background:#eff6ff;padding:6px 10px;border-radius:5px;margin-bottom:8px">📐 실별치수의 욕실('+bathRoomNames.join(', ')+')이 자동 생성되었습니다. 욕조·샤워부스 구성을 확인하세요.</div>' : '';
  var cards = baths.map(function(b,i){
    var fromRoom = bathRoomNames.indexOf(b.name)>=0;
    return '<div class="card">'+
      '<div class="card-head">'+
        '<input type="text" class="bn" data-bi="'+i+'" value="'+b.name+'" placeholder="욕실명" style="flex:1"'+(fromRoom?' readonly':'')+'>'+
        (fromRoom?'<span style="font-size:10px;color:#16a34a;white-space:nowrap">📐 자동</span>':'<button class="del-btn" onclick="delBath('+i+')">&#215;</button>')+
      '</div>'+
      '<div class="check-group">'+
        '<label class="ck-label"><input type="checkbox" class="bbt" data-bi="'+i+'"'+(b.bathtub?' checked':'')+'>욕조</label>'+
        '<label class="ck-label"><input type="checkbox" class="bsh" data-bi="'+i+'"'+(b.shower?' checked':'')+'>샤워부스</label>'+
        '<label class="ck-label"><input type="checkbox" class="btl" data-bi="'+i+'"'+(b.tiles?' checked':'')+'>타일 전체벽</label>'+
      '</div>'+
    '</div>';
  }).join('');
  return '<div class="section"><div class="section-title">욕실 구성</div><div class="section-body">'+
    autoNote+
    '<div id="bath-list">'+(cards||'<div class="empty-msg">실별치수 탭에서 욕실을 추가하면 자동 생성됩니다</div>')+'</div>'+
    '<button class="add-btn" onclick="addBath()">+ 욕실 수동 추가</button>'+
  '</div></div>';
}
function attachBathEvents(){
  document.querySelectorAll('.bn').forEach(function(inp){ inp.oninput=function(){ baths[+inp.dataset.bi].name=inp.value; onChange(); }; });
  document.querySelectorAll('.bbt').forEach(function(chk){ chk.onchange=function(){ baths[+chk.dataset.bi].bathtub=chk.checked; onChange(); }; });
  document.querySelectorAll('.bsh').forEach(function(chk){ chk.onchange=function(){ baths[+chk.dataset.bi].shower=chk.checked; onChange(); }; });
  document.querySelectorAll('.btl').forEach(function(chk){ chk.onchange=function(){ baths[+chk.dataset.bi].tiles=chk.checked; onChange(); }; });
}
function addBath(){ baths.push({name:'',bathtub:false,shower:true,tiles:true,_manual:true}); render(6); }
function delBath(i){ baths.splice(i,1); render(6); }

// ── ⑧ 설비·전기 ──
function autoCounts(){
  // 설비·전기 자동 기본값 (실별치수 기준) — 입력을 비우면 이 값이 쓰임
  var lives=rooms.filter(function(r){return r.name&&r.name.indexOf('욕실')<0&&BALCONIES.indexOf(r.name)<0;});
  var NONROOM=['거실','주방','식당','주방식당','현관','창고','다용도','펜트리','보일러','복도','베란다'];
  var roomCnt=lives.filter(function(r){return !NONROOM.some(function(k){return r.name.indexOf(k)>=0;});}).length||1;
  var c=function(re){return rooms.filter(function(r){return r.name&&re.test(r.name);}).length;};
  return { room:roomCnt, living:c(/거실/)||1, kitchen:c(/주방|식당/)||1, entry:c(/현관/)||1,
           balc:Math.max(1,c(/발코니/)), bath:Math.max(1,c(/욕실/)), balcPipe:c(/발코니/), ac:c(/거실|안방|침실/)||0 };
}

function onIvBt(v){ sv.iv_btKey=v; sv.iv_strId=''; sv.iv_grade=''; sv.iv_eqMap={}; render(0); }
function onIvStr(v){ sv.iv_strId=v; sv.iv_grade=''; render(0); }
function ivTgEq(id){ var eq=BD[sv.iv_btKey].equip.filter(function(e){return e.id===id;})[0]; var es=ivGEq(eq); sv.iv_eqMap[id]={on:!es.on,rate:es.rate,qty:es.qty}; render(0); }
function ivSetRate(id,v){ var eq=BD[sv.iv_btKey].equip.filter(function(e){return e.id===id;})[0]; var es=ivGEq(eq); sv.iv_eqMap[id]={on:es.on,rate:parseFloat(v)||0,qty:es.qty}; render(0); }
function ivSetQty(id,v){ var eq=BD[sv.iv_btKey].equip.filter(function(e){return e.id===id;})[0]; var es=ivGEq(eq); sv.iv_eqMap[id]={on:es.on,rate:es.rate,qty:parseFloat(v)||0}; render(0); }

// 보험가액 계산 (insurance-calc 로직)
function calcInsurance(){
  if(!sv.iv_btKey||!sv.iv_strId||!sv.iv_grade||!sv.iv_area||!sv.iv_cYear||!sv.iv_cMonth)return null;
  var b=BD[sv.iv_btKey]; if(!b)return null;
  var s=b.structures.filter(function(x){return x.id===sv.iv_strId;})[0]; if(!s)return null;
  var A=PF(sv.iv_area); if(A<=0)return null;
  var up=s.grades[parseInt(sv.iv_grade)]; if(!up)return null;
  var cc=A*up, ec=0, el=[];
  b.equip.forEach(function(eq){
    var es=ivGEq(eq);
    if(!es.on)return;
    var c=eq.t==='A'?A*es.rate:es.rate*es.qty;
    if(c<=0)return;
    ec+=c; el.push({label:eq.label,cost:c});
  });
  var tc=cc+ec;
  var cy=PI(sv.iv_cYear),cm=PI(sv.iv_cMonth),ay=PI(sv.iv_aYear),am=PI(sv.iv_aMonth);
  var em=(ay-cy)*12+(am-cm);
  if(em<0)return{error:'사고년월이 건축년월보다 앞섭니다.'};
  var dep=DEP[s.dep], rr=1-dep.rate*(em/12), res=Math.max(0.3,rr), cap=rr<0.3;
  var iv=Math.round(tc*res), c8=Math.round(iv*0.8);
  return{up:up,A:A,cc:cc,el:el,ec:ec,tc:tc,em:em,dep:dep,rr:rr,res:res,cap:cap,iv:iv,c8:c8,code:s.code};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━
//  산출 계산 엔진
// ━━━━━━━━━━━━━━━━━━━━━━━━━
function PF(v){return parseFloat(v)||0;}
function PI(v){return parseInt(v)||0;}
function R2(n){var s=PF(n).toFixed(2);return s.replace(/0+$/,"").replace(/\.$/,"");}
function FMT(n){return Math.round(n||0).toLocaleString('ko-KR');}
function RUP(v,u){return Math.ceil(v/u)*u;}

function runCalc(){
  syncIn();
  // 욕실 탭을 열지 않았어도 실별치수의 욕실을 위생/욕실 산출에 반영
  var bathNames=rooms.filter(function(r){return r.name&&r.name.indexOf('욕실')>=0;}).map(function(r){return r.name;});
  bathNames.forEach(function(nm){
    if(!baths.find(function(b){return b.name===nm;})) baths.push({name:nm,bathtub:true,shower:false,tiles:true});
  });
  // 실별치수에서 삭제된 욕실은 위생기구 산출에서도 제거 (수동 추가분은 유지)
  baths=baths.filter(function(b){return bathNames.indexOf(b.name)>=0||b._manual===true;});
  // 실 분류
  var lives = rooms.filter(function(r){return r.name&&r.w&&r.d&&r.name.indexOf('욕실')<0;});
  var bathRooms = rooms.filter(function(r){return r.name&&r.w&&r.d&&r.name.indexOf('욕실')>=0;});
  var balcs = rooms.filter(function(r){return r.name&&r.w&&r.d&&BALCONIES.indexOf(r.name)>=0;});
  // 발코니는 lives에서 제외
  lives = lives.filter(function(r){return BALCONIES.indexOf(r.name)<0;});

  var bathArea = bathRooms.reduce(function(s,r){return s+roomArea(r);},0);
  var balcArea = balcs.reduce(function(s,r){return s+roomArea(r);},0);
  var excArea = lives.reduce(function(s,r){return s+roomArea(r);},0)+bathArea;
  var cleanArea = excArea+balcArea;
  var lifePerim = lives.reduce(function(s,r){return s+2*(PF(r.w)+PF(r.d));},0);
  var bathPerim = bathRooms.reduce(function(s,r){return s+2*(PF(r.w)+PF(r.d));},0);
  // 천장몰딩: 거실·주방·식당을 제외한 실 둘레 자동합산 + 거실·주방 구간(수동 덧셈식, 비우면 실 둘레 자동)
  var LK_RE=/거실|주방|식당/;
  var moldRooms = lives.filter(function(r){return !LK_RE.test(r.name);}).concat(bathRooms);
  var lkRooms = lives.filter(function(r){return LK_RE.test(r.name);});
  var moldManualStr = (sv.molding_manual||'').trim();
  var moldManual = safeEval(moldManualStr);
  var moldingIsManual = moldManual>0;

    it('스위치','2구','EA',sw2,3100,11631,0,'ㅇ 거실/주방 등 2구 '+sw2+'개소','='+sw2),
    it('콘센트','2구','EA',out2,2200,8894,0,'ㅇ 전유('+R2(eA)+')/4.0㎡'+(outKitchen?'+주방가산('+outKitchen+')':'')+' = '+out2+'개소','=ROUNDUP('+R2(eA)+'/4.0,0)'+(outKitchen?'+'+outKitchen:'')),
    it('콘센트','방우/2구','EA',outBath,3600,8894,0,'ㅇ 욕실 방수콘센트 '+outBath+'개소','='+outBath),
    it('LED등기구','거실등','EA',ledLiving,298000,34756,0,'ㅇ 거실 '+ledLiving+'EA','='+ledLiving),
    it('LED등기구','방등','EA',ledRoom,139000,34756,0,'ㅇ 방 '+ledRoom+'EA','='+ledRoom),
    it('LED등기구','주방등','EA',ledKit,120000,34756,0,'ㅇ 주방 '+ledKit+'EA','='+ledKit),
    it('LED등기구','발코니등','EA',ledBalc,47000,30241,0,'ㅇ 발코니 '+ledBalc+'EA','='+ledBalc),
    it('LED등기구','욕실등','EA',ledBath,97000,18883,0,'ㅇ 욕실 '+ledBath+'EA','='+ledBath),
    it('LED등기구','현관등','EA',ledEntry,45000,30241,0,'ㅇ 현관 '+ledEntry+'EA','='+ledEntry)
  ];
  c11=c11.filter(function(x){return x.qty>0;});   // 0 입력 항목 제외
  if(sv.wallpad)c11.push(it('월패드','-','EA',1,264000,43788,0,'ㅇ 월패드 1EA','=1'));
  if(sv.interphone)c11.push(it('현관자기','-','EA',1,12100,0,0,'ㅇ 현관자기 1EA','=1'));
  if(sv.speaker)c11.push(it('세대방송스피커','-','EA',1,5500,0,0,'ㅇ 방송스피커 1EA','=1'));
  if(sv.fire_ex)c11.push(it('확산소화기','-','EA',1,24000,444,0,'ㅇ 확산소화기 1EA','=1'));
  cats.push({no:11,name:'전기공사',rows:c11});

  // 소계
  cats.forEach(function(c){ c.sub=c.rows.reduce(function(s,r){return s+r.ta;},0); });
  var gs=cats.reduce(function(s,c){return s+c.sub;},0);
  var ovRate=gs<=5000000?0.25:gs<=10000000?0.245:gs<=20000000?0.24:gs<=35000000?0.235:gs<=50000000?0.23:gs<=75000000?0.225:gs<=100000000?0.22:gs<=200000000?0.215:0.21;
  var ov=Math.floor(gs*ovRate);
  var tp=gs+ov;
  var ad=Math.round(tp*(1-deprTotal));

  // ⑫ 철거
  var wb50=Math.round(wallArea*0.5*100)/100;
  var dRows=[
    it('천장철거','석고판해체','㎡',excArea-bathArea,0,6174,123,basisRooms(lives),fxExclNoBath),
    it('벽체철거','석고판해체','㎡',wb50,0,6174,123,'ㅇ 거실/방 벽면적('+R2(wallArea)+')*0.5','='+R2(wallArea)+'*0.5'),
    it('도배해체','천장','㎡',excArea-bathArea,0,3480,0,basisRooms(lives),fxExclNoBath),
    it('도배해체','벽체','㎡',wallArea,0,2681,0,basisPerim(lives,'',2.3),fxPerim(lives,2.3)),
    it('바닥철거',floorSp,'㎡',excArea-bathArea,0,2229,0,basisRooms(lives),fxExclNoBath),
    it('타일철거','압착붙이기','㎡',bathWall+bathFloor,0,16574,994,'ㅇ 욕실벽('+R2(bathWall)+')+바닥('+R2(bathFloor)+')','='+R2(bathWall)+'+'+R2(bathFloor)),

    it('잔존물 상차','보통인부','인',Math.ceil(excArea/20),0,172068,0,'ㅇ '+Math.ceil(excArea/20)+'인','='+Math.ceil(excArea/20))
  ];
  var ds=dRows.reduce(function(s,r){return s+r.ta;},0);
  var dOv=Math.floor(ds*ovRate), dt=ds+dOv, da=Math.min(dt,Math.floor(ad*0.10));
  var allCats=cats.concat([{no:12,name:'철거공사',rows:dRows,sub:ds}]);
  var finalTotal=ad+da;
  // 지급보험금: 가입금액 입력 시 80% 조건부 실손보상 (주택화재 기준), 미입력 시 손해액 전액
  var sumIns=PF(String(sv.iv_sum||'').replace(/,/g,'')), ded=PF(String(sv.iv_ded||'').replace(/,/g,''));
  var payMode='full', payRate=1, base80=unitV*0.8, payBefore=finalTotal;
  if(sumIns>0&&unitV>0){
    if(sumIns<base80){ payMode='prop'; payRate=sumIns/base80; payBefore=Math.round(finalTotal*payRate); }
    else { payMode='limit'; payBefore=Math.min(finalTotal,sumIns); }
  } else if(sumIns>0){ payMode='limit'; payBefore=Math.min(finalTotal,sumIns); }

    depr:{elapsed:elapsed,yr:Math.round(yr*100)/100,rate:rate,total:deprTotal},
    ins:{rows:iRows,aux:auxEq,total:insTotal,share:share,unit_v:unitV},
    cats:allCats,mainCats:cats,gs:gs,ov:ov,ovRate:ovRate,tp:tp,ad:ad,
    demo:{rows:dRows,ds:ds,do:dOv,dt:dt,da:da},
    final:finalTotal,pay:pay,excArea:excArea,
    payInfo:{mode:payMode,rate:payRate,sum:sumIns,base80:base80,before:payBefore,ded:ded},
    assumptions:buildAssumptions()
  };
  return calcResult;
}
// 산출에 쓰인 자동값·미입력 항목 목록 (결과 탭 체크리스트)
function buildAssumptions(){
  var L=[];
  var ivc=calcInsurance();
  if(!ivc||ivc.error) L.push({t:'miss',tab:0,msg:'보험가액 미산정 → 감가율 0%·세대보험가액 0원으로 계산됨 (용도·구조·급수·연면적·건축년월 입력)'});
  else L.push({t:'ok',msg:'경년감가 '+((1-ivc.res)*100).toFixed(2)+'% · 세대보험가액 연동됨'});
  var noDim=rooms.filter(function(r){return r.name&&!(r.w&&r.d);});
  if(noDim.length) L.push({t:'miss',tab:1,msg:'치수 미입력 실: '+noDim.map(function(r){return r.name;}).join(', ')+' (산출에서 제외됨)'});
  var validW=windows.filter(function(w){return w.w&&w.h;});
  if(!validW.length) L.push({t:'miss',tab:2,msg:'창호 미입력 → 창호·유리·커튼박스 물량 0 (창호 탭에서 자동 생성 가능)'});
  var noSize=windows.filter(function(w){return !(w.w&&w.h);});
  if(validW.length&&noSize.length) L.push({t:'miss',tab:2,msg:'규격 미입력 창 '+noSize.length+'건 ('+noSize.map(function(w){return (w.locs||[]).join('·')||'위치미지정';}).join(', ')+') → 산출에서 제외됨'});
  if(sv.door_cnt==='') L.push({t:'assume',tab:2,msg:'여닫이문 자동 '+autoDoorCnt()+'개소 (안방·침실·드레스룸·다용도실·욕실 기준)'});
  if(!sv.entry_door_w||!sv.entry_door_h) L.push({t:'assume',tab:2,msg:'현관문 규격 기본 1000×2100 적용'});
  if(!(sv.molding_manual||'').trim()) L.push({t:'assume',tab:3,msg:'거실·주방 몰딩·도배 벽둘레 자동 ('+(autoLKExpr()||'거실·주방 실 없음 → 0')+') — 통합구간이면 도면 벽면길이 덧셈식 입력 권장'});
  else if(!(sv.wall_lk_manual||'').trim()) L.push({t:'ok',msg:'거실·주방 구간 입력식('+sv.molding_manual.trim()+')을 몰딩·벽체도배에 적용'});
  if(!(sv.base_door_extra||'').trim()) L.push({t:'assume',tab:3,msg:'걸레받이 차감식 자동 ('+(autoBaseDeductExpr()||'0')+')'});
  if(!sv.sink_len) L.push({t:'assume',tab:4,msg:'싱크대 길이 미입력 → 2.7m 기준 단가 적용'});
  var ac=autoCounts();
  var blanks=[];
  if((sv.ac_rooms||'').trim()==='') blanks.push('에어컨배관 '+ac.ac);
  if((sv.balcony_cnt||'').trim()==='') blanks.push('발코니배관 '+ac.balcPipe);
  if((sv.circuit_cnt||'').trim()==='') blanks.push('분전함 8회로');
  if(!sv.led_living&&!sv.led_room&&!sv.led_kitchen) blanks.push('LED 거실'+ac.living+'·방'+ac.room+'·주방'+ac.kitchen);
  if(blanks.length) L.push({t:'assume',tab:7,msg:'설비·전기 자동값: '+blanks.join(', ')});
  var sumIns=PF(String(sv.iv_sum||'').replace(/,/g,''));
  if(sumIns>0) L.push({t:'ok',msg:'가입금액 '+FMT(sumIns)+'원 기준 지급보험금 산정'});
  else L.push({t:'assume',tab:0,msg:'보험가입금액 미입력 → 지급보험금 = 손해액 전액'});
  return L;
}

var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadXLSX(){
  return new Promise(function(res,rej){
    if(window.XLSX) return res(window.XLSX);
    var s=document.createElement('script'); s.src=XLSX_URL;
    s.onload=function(){ window.XLSX?res(window.XLSX):rej(new Error('load')); };
    s.onerror=function(){ rej(new Error('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
    document.head.appendChild(s);
  });
}
function exportExcel(){
  var btn=document.getElementById('xl-btn'); var msg=document.getElementById('result-copy-msg');
  if(btn){ btn.disabled=true; btn.textContent='엑셀 생성 중…'; }
  loadXLSX().then(function(X){
    var r=runCalc(); if(!r||r.excArea<=0) throw new Error('실별치수를 먼저 입력하세요.');
    var wb=buildWorkbook(X,r);
    X.writeFile(wb, shareFileName('xlsx').replace(/^현장_/, '건물손해액_'));
    if(msg) msg.textContent='✓ 엑셀 파일이 저장되었습니다.';
  }).catch(function(e){
    alert(e.message||'엑셀 생성 실패');
  }).then(function(){ if(btn){ btn.disabled=false; btn.textContent='📗 엑셀 산출서 다운로드 (.xlsx)'; } });
}
function buildWorkbook(X,r){
  var wb=X.utils.book_new();
  var bd=sv.iv_btKey?BD[sv.iv_btKey]:null;
  var st=bd?bd.structures.filter(function(x){return x.id===sv.iv_strId;})[0]:null;
  var num=function(v){return {t:'n',v:Math.round(v)};};
  var f=function(formula,fmt){ var c={t:'n',f:formula}; if(fmt)c.z=fmt; return c; };
  var A=X.utils.encode_cell;
  var WON='#,##0', Q='#,##0.00';

  // ── ② 내역서 (수량·금액 수식) ──
  var det=[['No','품명','규격','단위','수량','자재단가','자재금액','노무단가','노무금액','경비단가','경비금액','합계','산출근거']];
  var subCells={};   // cat.no → 내역서 소계 셀 주소
  var rowIdx=1;      // 0-based 다음 행
  r.cats.forEach(function(c){
    det.push([c.no+'. '+c.name]); rowIdx++;
    var start=rowIdx;
    c.rows.forEach(function(row){
      var R=rowIdx+1; // 1-based 엑셀 행
      var fx=String(row.formula||'').trim();
      var qty=(/^=[0-9.+\-*/() ,A-Z]+$/.test(fx)&&fx.length>1)?f('ROUND('+fx.slice(1)+',2)',Q):{t:'n',v:row.qty,z:Q};
      det.push(['',row.n,row.sp,row.unit,qty,
        {t:'n',v:row.m,z:WON}, f('ROUND(E'+R+'*F'+R+',0)',WON),
        {t:'n',v:row.l,z:WON}, f('ROUND(E'+R+'*H'+R+',0)',WON),
        {t:'n',v:row.e,z:WON}, f('ROUND(E'+R+'*J'+R+',0)',WON),
        f('G'+R+'+I'+R+'+K'+R,WON), row.basis]);
      rowIdx++;
    });
    var end=rowIdx;
    var R=rowIdx+1;
    det.push(['','소계','','','','',f('SUM(G'+(start+1)+':G'+end+')',WON),'',f('SUM(I'+(start+1)+':I'+end+')',WON),'',f('SUM(K'+(start+1)+':K'+end+')',WON),f('SUM(L'+(start+1)+':L'+end+')',WON),'']);
    subCells[c.no]='내역서!L'+R;
    rowIdx++;
    det.push([]); rowIdx++;
  });
  var wsD=X.utils.aoa_to_sheet(det);
  wsD['!cols']=[{wch:4},{wch:22},{wch:16},{wch:6},{wch:9},{wch:10},{wch:12},{wch:10},{wch:12},{wch:9},{wch:11},{wch:13},{wch:60}];

  // ── ① 갑지 ──
  var g=[['건물손해액 산출 갑지'],[],
    ['건물명',sv.iv_name||''],['보험회사',sv.iv_insurer||''],
    ['용도/구조',(bd?bd.label:'-')+' / '+(st?st.label:'-')+' / '+(sv.iv_grade||'-')+'급'],
    ['건축년월',sv.iv_cYear+'-'+sv.iv_cMonth],['사고년월',sv.iv_aYear+'-'+sv.iv_aMonth],
    ['전유면적(㎡)',{t:'n',v:r.excArea,z:Q}],['경과월수',r.depr.elapsed],['감가율',{t:'n',v:r.depr.total,z:'0.0000%'}],
    [],['구분','금액(원)']];
  var mainStart=g.length+1;
  r.mainCats.forEach(function(c){ g.push([c.no+'. '+c.name, f(subCells[c.no],WON)]); });
  var mainEnd=g.length;
  g.push(['소계', f('SUM(B'+mainStart+':B'+mainEnd+')',WON)]); var rSub=g.length;
  g.push(['공과잡비('+(r.ovRate*100).toFixed(2)+'%)', f('ROUNDDOWN(B'+rSub+'*'+r.ovRate+',0)',WON)]); var rOv=g.length;
  g.push(['합계', f('B'+rSub+'+B'+rOv,WON)]); var rTp=g.length;
  g.push(['감가 후 손해액 (합계×(1−감가율))', f('ROUND(B'+rTp+'*(1-B10),0)',WON)]); var rAd=g.length;
  g.push(['철거공사 소계', f(subCells[12],WON)]); var rDs=g.length;
  g.push(['철거 공과잡비', f('ROUNDDOWN(B'+rDs+'*'+r.ovRate+',0)',WON)]); var rDo=g.length;
  g.push(['철거공사 합계', f('B'+rDs+'+B'+rDo,WON)]); var rDt=g.length;
  g.push(['인정 철거비 (손해액 10% 한도)', f('MIN(B'+rDt+',ROUNDDOWN(B'+rAd+'*0.1,0))',WON)]); var rDa=g.length;
  g.push(['최종 손해액', f('B'+rAd+'+B'+rDa,WON)]); var rFin=g.length;
  g.push([]);
  g.push(['세대보험가액', num(r.ins.unit_v)]); var rIV=g.length;
  g.push(['보험가입금액', r.payInfo.sum>0?num(r.payInfo.sum):'']); var rSum=g.length;
  g.push(['자기부담금', num(r.payInfo.ded)]); var rDed=g.length;
  g.push(['보상비율', {t:'n',v:r.payInfo.rate,z:'0.00%'}]); var rRate=g.length;
  g.push(['지급보험금', f('MAX(0,'+(r.payInfo.mode==='limit'?'MIN(B'+rFin+',B'+rSum+')':'ROUND(B'+rFin+'*B'+rRate+',0)')+'-B'+rDed+')',WON)]);
  var wsG=X.utils.aoa_to_sheet(g);
  wsG['!cols']=[{wch:30},{wch:18}];

  // ── ③ 수량산출서 ──
  var q=[['공종','품명','규격','단위','산출근거','계산식','수량']];
  r.cats.forEach(function(c){ c.rows.forEach(function(row){ q.push([c.no+'. '+c.name,row.n,row.sp,row.unit,row.basis,row.formula,{t:'n',v:row.qty,z:Q}]); }); });
  var wsQ=X.utils.aoa_to_sheet(q);
  wsQ['!cols']=[{wch:12},{wch:22},{wch:16},{wch:6},{wch:60},{wch:40},{wch:10}];

  // ── ④ 보험가액 ──
  var iv=[['건물 보험가액 산출'],[],['항목','수량/면적','단가','금액(원)']];
  r.ins.rows.forEach(function(x){ iv.push([x.n,{t:'n',v:x.a,z:Q},num(x.up),num(x.amt)]); });
  r.ins.aux.forEach(function(x){ iv.push([x.n,x.a,num(x.up),num(x.amt)]); });
  if(r.ins.total>0){
    iv.push([]);
    iv.push(['경과월수',r.depr.elapsed]); iv.push(['감가율',{t:'n',v:r.depr.total,z:'0.0000%'}]);
    iv.push(['건물(동) 보험가액',num(r.ins.total)]);
    iv.push(['세대 지분율 (전유/연면적)',{t:'n',v:r.ins.share,z:'0.000000%'}]);
    iv.push(['세대보험가액',num(r.ins.unit_v)]);
  } else iv.push(['(보험가액 미산정)']);
  var wsI=X.utils.aoa_to_sheet(iv); wsI['!cols']=[{wch:30},{wch:14},{wch:14},{wch:16}];

  // ── ⑤ 입력정보 ──
  var inp=[['실명','가로(m)','세로(m)','추가면적식','면적(㎡)','구분']];
  rooms.forEach(function(rm,i){
    var R=i+2; var isB=BALCONIES.indexOf(rm.name)>=0;
    inp.push([rm.name,PF(rm.w),PF(rm.d),rm.extra||'',f('B'+R+'*C'+R+(rm.extra&&safeEval(rm.extra)?'+'+String(rm.extra).replace(/[×x]/g,'*'):''),Q),isB?'발코니':(rm.name.indexOf('욕실')>=0?'욕실':'전유')]);
  });
  inp.push([]); inp.push(['입력 요약']);
  generateText().split('\n').forEach(function(line){ inp.push([line]); });
  var wsN=X.utils.aoa_to_sheet(inp); wsN['!cols']=[{wch:22},{wch:9},{wch:9},{wch:20},{wch:10},{wch:8}];

  X.utils.book_append_sheet(wb,wsG,'갑지');
  X.utils.book_append_sheet(wb,wsD,'내역서');
  X.utils.book_append_sheet(wb,wsQ,'수량산출서');
  X.utils.book_append_sheet(wb,wsI,'보험가액');
  X.utils.book_append_sheet(wb,wsN,'입력정보');
  return wb;
}

      L.push('  '+row.n+' / '+row.sp+' / '+row.unit+' / '+R2(row.qty)+' / 산출근거:'+row.basis+' / 계산식:'+row.formula+' / 자재:'+FMT(row.m)+' / 노무:'+FMT(row.l)+' / 경비:'+FMT(row.e)+' / 계:'+FMT(row.ta));
    });
  });
  L.push('');
  L.push('▶ 갑지 요약');

  L.push('합계: '+FMT(r.tp)+'원 / 감가율: '+pct+'%');
  L.push('감가후손해액: '+FMT(r.ad)+'원');
  L.push('철거공사(공과잡비포함): '+FMT(r.demo.dt)+'원 / 인정철거비: '+FMT(r.demo.da)+'원');
  L.push('최종손해액: '+FMT(r.final)+'원');

  L.push('지급보험금: '+FMT(r.pay)+'원');
  return L.join('\n');

function copyResult(){
  var txt=buildResultText();
  var msg=document.getElementById('result-copy-msg');
  function done(){ if(msg)msg.textContent='✓ 복사 완료! Claude에 붙여넣으세요.'; }
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt,done); }); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); cb(); }

    L.push(r.name+': '+r.w+'x'+r.d+' = '+(parseFloat(r.w)*parseFloat(r.d)).toFixed(2)+'㎡');
  });

  if(blc.length){ L.push('  [발코니]'); blc.forEach(function(r){ L.push('  '+r.name+': '+r.w+'x'+r.d+' = '+(parseFloat(r.w)*parseFloat(r.d)).toFixed(2)+'㎡'); }); }

  windows.forEach(function(w){ if(w.type){ var l=w.locs.length?'('+w.locs.join('·')+') ':''; var s=w.w&&w.h?' '+w.w+'x'+w.h:''; L.push(l+w.type+s+' — '+w.qty+'개소'); } });
  L.push('\n[마감재]');
  L.push('바닥(거실·침실): '+sv.floor_main);
  L.push('바닥(발코니): '+sv.floor_balcony);

  if(sv.shoecab_len) L.push('현관신발장: '+sv.shoecab_len+'자 (≈'+(parseFloat(sv.shoecab_len)*0.30).toFixed(2)+'m)');
