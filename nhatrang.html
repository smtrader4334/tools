<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나트랑 가족여행</title>
<meta name="description" content="2026년 10월 23일부터 11월 2일까지, 나트랑 가족여행 도우미">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A5A66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나트랑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F6F4; --paper:#FFFFFF; --ink:#0F3237; --ink2:#55737A; --line:#D3E3E0;
  --sea:#0A5A66; --sea2:#0F7F8A; --on-sea:#FFFFFF; --foam:#E2F1EE;
  --mango:#FFB81C; --mango-ink:#4A3000; --pitaya:#D42A63; --leaf:#1B8A5A; --warn:#A8500A; --warn-bg:#FFF3D6;
  --hero:#0A5A66; --hero-ink:#F3FBFA; --hero-dim:#A9D6D6;
  --r:18px; --rs:12px;
  --ff:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --fd:"Be Vietnam Pro","Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06181B; --paper:#0C262A; --ink:#E6F2F0; --ink2:#9AB6B7; --line:#1C3E43;
    --sea:#45C7C1; --sea2:#2FA9A8; --on-sea:#04262A; --foam:#11353A;
    --mango:#FFC53D; --pitaya:#FF6F9B; --leaf:#55CE98; --warn:#FFC978; --warn-bg:#3A2A08;
    --hero:#0D434B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--ff);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--sea);text-underline-offset:3px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:6px}

#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}
#view{outline:none}
.vh{font:400 26px/1.2 var(--fd);font-synthesis:none;letter-spacing:-.01em;margin:10px 2px 14px}
.vh small{display:block;font:400 13px/1.5 var(--ff);color:var(--ink2);margin-top:4px;letter-spacing:0}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.sec-h h2{font:400 19px/1.25 var(--fd);font-synthesis:none}
.sec-h .more{background:none;border:0;padding:6px 0;color:var(--sea);font-weight:700;font-size:13px}
.note{color:var(--ink2);font-size:13px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:var(--rs);padding:10px 12px;font-size:13px;line-height:1.5}
.callout b{font-weight:700}

/* ticket hero */
.ticket{position:relative;background:var(--hero);color:var(--hero-ink);border-radius:22px;overflow:hidden;
  background-image:radial-gradient(circle at 50% 110%,transparent 0 13px,rgba(255,255,255,.07) 13px 14.5px,transparent 14.5px);background-size:34px 18px}
.tk-top{padding:18px 20px 16px}
.tk-name{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--hero-dim)}
.tk-name b{color:var(--hero-ink);font-weight:700}
.tk-gear{background:rgba(255,255,255,.12);border:0;color:var(--hero-ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.tk-route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:8px}
.tk-port b{display:block;font:800 34px/1 var(--fd);letter-spacing:.01em}
.tk-port span{font-size:13px;color:var(--hero-dim)}
.tk-port.r{text-align:right}
.tk-path{display:flex;align-items:center;gap:8px;padding-bottom:16px}
.tk-path::before,.tk-path::after{content:"";flex:1;border-top:2px dotted rgba(255,255,255,.45)}
.tk-path svg{width:24px;height:24px;flex:none;fill:var(--mango)}
.tk-status{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.tk-big{font:800 46px/.95 var(--fd);font-synthesis:none;color:var(--mango);letter-spacing:-.01em}
.tk-sub{text-align:right;font-size:13px;color:var(--hero-dim);line-height:1.45}
.tk-sub b{display:block;color:var(--hero-ink);font-size:15px;font-weight:700}
.tk-tear{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.35);margin:0 14px}
.tk-tear::before,.tk-tear::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk-tear::before{left:-25px}.tk-tear::after{right:-25px}
.tk-bot{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;padding:14px 20px 16px}
.tk-bot span{display:block;font-size:12px;color:var(--hero-dim)}
.tk-bot b{font:700 19px/1.2 var(--fd);font-variant-numeric:tabular-nums}
.tk-bot button{all:unset;cursor:pointer;display:block}

/* weather */
.wx-now{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wx-now .ic{font-size:34px;line-height:1}
.wx-now b{font:800 28px/1 var(--fd)}
.wx-now span{color:var(--ink2);font-size:13px}
.wx-days{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.wx-days::-webkit-scrollbar{display:none}
.wx-d{flex:0 0 58px;text-align:center;padding:8px 2px;border-radius:var(--rs);border:1px solid var(--line);font-size:12px;background:var(--paper)}
.wx-d.trip{border-color:var(--mango);box-shadow:inset 0 -3px 0 var(--mango)}
.wx-d .dt{color:var(--ink2)}
.wx-d .ic{font-size:20px;line-height:1.5}
.wx-d .tp{font-weight:700;font-variant-numeric:tabular-nums}
.wx-d .pp{color:var(--sea2);font-variant-numeric:tabular-nums}
.wx-d .pp.hi{color:var(--pitaya);font-weight:700}

/* quick grid */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 11px;text-align:center;font-size:13px;line-height:1.3;font-weight:500}
.q .e{display:block;font-size:24px;line-height:1.3;margin-bottom:2px}
.q:active{background:var(--foam)}

/* chips & seg */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.chip[aria-pressed=true],.chip.on{background:var(--sea);border-color:var(--sea);color:var(--on-sea);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--foam);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:11px;padding:8px 4px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-selected=true]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);min-height:44px}
.btn.pri{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.mango{background:var(--mango);border-color:var(--mango);color:var(--mango-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--pitaya);border-color:var(--pitaya);background:none}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.full{display:flex;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1 1 0;min-width:0}

/* plan */
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 4px;padding:6px 16px 10px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg)}
.days::-webkit-scrollbar{display:none}
.dayc{flex:0 0 52px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:7px 0 6px;text-align:center;line-height:1.2}
.dayc .w{display:block;font-size:11px;color:var(--ink2)}
.dayc .n{display:block;font:800 18px/1.25 var(--fd)}
.dayc .x{display:block;font-size:12px;min-height:16px}
.dayc.today{border-color:var(--mango);border-width:2px;padding:6px 0 5px}
.dayc[aria-selected=true]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.dayc[aria-selected=true] .w{color:inherit;opacity:.8}
.dayhead{margin:8px 2px 4px}
.dayhead .k{font-size:13px;color:var(--ink2)}
.dayhead h2{font:400 24px/1.25 var(--fd);font-synthesis:none}
.dayhead .theme{all:unset;cursor:pointer;display:inline-block;margin-top:2px;font-size:14px;color:var(--sea);font-weight:700;border-bottom:1px dashed currentColor}
.daywx{display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0 0;padding:9px 12px;border-radius:var(--rs);background:var(--foam)}
.daywx.rain{background:var(--warn-bg);color:var(--warn)}
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:62px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:50px 26px 1fr;align-items:start;position:relative}
.tl .t{font:700 14px/1.3 var(--fd);font-variant-numeric:tabular-nums;padding-top:13px;text-align:right;color:var(--ink)}
.tl .t.none{font-size:11px;font-weight:400;color:var(--ink2);padding-top:15px}
.tl .dot{width:26px;display:grid;place-items:center;padding-top:12px;position:relative;z-index:1}
.tl .dot button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:var(--paper);border:2px solid var(--sea);display:grid;place-items:center;font-size:12px;color:var(--on-sea);box-sizing:border-box}
.tl .done .dot button{background:var(--sea)}
.tl .body{padding:9px 0 9px 8px;min-width:0}
.tl .it{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tl .it b{display:block;font-weight:700;font-size:15px;line-height:1.35}
.tl .it .m{display:block;color:var(--ink2);font-size:13px;margin-top:2px;white-space:pre-line}
.tl .done .it{opacity:.55}
.tl .done .it b{text-decoration:line-through}
.tl .lnk{display:flex;gap:12px;margin:5px 2px 0;font-size:13px}
.tl .lnk a,.tl .lnk button{background:none;border:0;padding:3px 0;color:var(--sea);font-weight:700;text-decoration:none;font-size:13px}
.empty{text-align:center;color:var(--ink2);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);margin-top:14px}
.addbar{margin-top:14px}

/* map */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:16px}
.lbl{font-size:12px;color:var(--ink2);margin:10px 2px 6px}
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--foam);height:min(56vh,480px);margin-top:8px}
.mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapwrap .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);font-size:13px;padding:20px}
.mapq{font-size:13px;color:var(--ink2);margin:10px 2px}
.mapq b{color:var(--ink)}
.place{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
.pl-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pl-h h3{font-size:16px;font-weight:700;line-height:1.35}
.pl-h h3 small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.heart{background:none;border:0;font-size:22px;line-height:1;padding:4px;color:var(--line)}
.heart[aria-pressed=true]{color:var(--pitaya)}
.pl-d{font-size:14px;margin-top:6px}
.pl-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--ink2)}
.pl-m .star{color:var(--ink);font-weight:700}
.tag{background:var(--foam);border-radius:6px;padding:2px 7px}
.pl-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* wallet */
.conv{display:grid;gap:8px}
.conv label{display:grid;grid-template-columns:1fr auto;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:4px 14px}
.conv input{border:0;background:none;width:100%;min-width:0;font:800 26px/1.4 var(--fd);padding:6px 0;outline:none;font-variant-numeric:tabular-nums}
.conv label:focus-within{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea) inset}
.conv .u{font-weight:700;color:var(--ink2);padding-left:10px}
.rate{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 12px;font-size:13px;color:var(--ink2);margin-top:8px}
.rate .rb{display:flex;gap:14px;white-space:nowrap}
.rate button{background:none;border:0;color:var(--sea);font-weight:700;font-size:13px;padding:6px 0}
.tk-fl{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:10px;font-size:13px;color:var(--hero-dim)}
.tk-fl b{color:var(--hero-ink);font-weight:700}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bn{border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:7px 9px;background:var(--paper);text-align:left;line-height:1.3}
.bn b{display:block;font:700 14px/1.3 var(--fd);font-variant-numeric:tabular-nums}
.bn span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sum b{font:800 30px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--foam);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--sea);border-radius:99px}
.bar.over i{background:var(--pitaya)}
.cats{display:grid;gap:6px;margin-top:12px;font-size:13px}
.cats div{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center}
.cats .bar{margin:0}
.cats em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.field{display:block;margin-top:10px}
.field>span{display:block;font-size:12px;color:var(--ink2);margin:0 2px 4px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.in{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1.4fr auto;gap:8px;align-items:end}
.cur{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:44px}
.cur button{border:0;background:var(--paper);padding:0 14px;font-weight:700;color:var(--ink2)}
.cur button[aria-pressed=true]{background:var(--sea);color:var(--on-sea)}
.sp-day{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin:16px 2px 6px}
.sp-day b{color:var(--ink);font-variant-numeric:tabular-nums}
.sp{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px}
.sp .n{min-width:0}
.sp .n b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .n span{font-size:12px;color:var(--ink2)}
.sp .a{text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.sp .a b{display:block;font-size:14px}
.sp .a span{font-size:12px;color:var(--ink2)}

/* guide */
.cg{margin-top:18px}
.cg h3{font:400 17px/1.3 var(--fd);font-synthesis:none;margin:0 2px 6px;display:flex;justify-content:space-between;align-items:baseline}
.cg h3 small{font:400 12px var(--ff);color:var(--ink2)}
.ck{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:6px}
.ck input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--sea)}
.ck .tx{font-size:14px;line-height:1.45}
.ck .tx small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.ck.on .tx>span{text-decoration:line-through;color:var(--ink2)}
.ck .x{background:none;border:0;color:var(--ink2);font-size:18px;line-height:1;padding:2px 4px}
.ph-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}
.ph-item .ko{font-size:13px;color:var(--ink2)}
.ph-item .vi{display:block;font-weight:700;font-size:16px;line-height:1.35}
.ph-item .pr{display:block;font-size:13px;color:var(--sea);font-weight:500}
.ph-item .go{color:var(--ink2);font-size:12px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.nums div{background:var(--paper);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;line-height:1.3}
.nums b{display:block;font:800 16px var(--fd)}
.nums span{font-size:12px}.nums small{display:block;font-size:11px;color:var(--ink2)}
details.tip{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
details.tip summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";font:400 22px/1 var(--ff);color:var(--ink2)}
details.tip[open] summary::after{content:"−"}
details.tip ul{margin:0;padding:0 16px 14px 34px;font-size:14px}
details.tip li{margin-top:6px}
details.tip li b{font-weight:700}
.tel{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;text-decoration:none;color:var(--ink)}
.tel b{display:block;font-size:15px}
.tel span{font-size:13px;color:var(--ink2)}
.tel em{font:800 17px var(--fd);font-style:normal;color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
.tel.red em{color:var(--pitaya)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{position:relative;border:0;background:none;display:grid;place-content:center;justify-items:center;gap:2px;font-size:11px;color:var(--ink2);font-weight:500}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--sea);font-weight:700}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--mango)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,28,32,.55)}
.sheet-in{background:var(--paper);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet-in::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h2{font:400 21px/1.3 var(--fd);font-synthesis:none;margin-bottom:4px}
.sheet .mapwrap{height:min(42vh,340px)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}

/* show card (full screen) */
.show{position:fixed;inset:0;z-index:50;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 22px);overflow:auto}
.show .x{align-self:flex-end;background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:999px;padding:8px 16px;font-weight:700}
.show .c{margin:auto 0;padding:20px 0}
.show .k{font-size:14px;color:var(--hero-dim)}
.show .big{font:800 clamp(30px,9vw,52px)/1.2 var(--fd);margin:10px 0 14px;word-break:keep-all;overflow-wrap:anywhere}
.show .mid{font:700 clamp(20px,5.6vw,28px)/1.35 var(--ff);margin-top:10px;word-break:keep-all;overflow-wrap:anywhere}
.show .pr{font-size:18px;color:var(--mango);font-weight:700}
.show .sm{font-size:15px;color:var(--hero-dim);margin-top:14px;white-space:pre-line}
.show .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.show .acts .btn{background:var(--mango);border-color:var(--mango);color:var(--mango-ink)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:700px){#app{padding-top:28px}}

/* 실시간 검색 결과 */
.res-h{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%}
.res-h .no{width:28px;height:28px;border-radius:50%;background:var(--pitaya);color:#fff;display:grid;place-items:center;font:700 13px var(--fd)}
.res-h .nm b{display:block;font-size:16px;line-height:1.35}
.res-h .nm small{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.toast{width:max-content;border-radius:18px}
#gm-slot{height:min(44vh,380px)}

    if(j.spend?.some(x=>!isObj(x)||!validDate(x.d)||!Number.isFinite(x.amt)||x.amt<=0||x.amt>1e12||!['KRW','VND'].includes(x.cur)))throw new Error('잘못된 지출');
    if(j.rate&&(!Number.isFinite(j.rate.v)||j.rate.v<=1||j.rate.v>=100))throw new Error('잘못된 환율');
    if(Object.values(j.plan).some(l=>Array.isArray(l)&&l.length>5000))throw new Error('일정이 너무 많음');
  }
  if (strict && (!validDate(j.trip.start) || !validDate(j.trip.end) || j.trip.end < j.trip.start || diffDays(j.trip.end,j.trip.start)>30)) throw new Error('잘못된 여행 날짜');
  for (const k of Object.keys(d.trip)) if (typeof j.trip[k] === 'string') d.trip[k] = txt(j.trip[k], k === 'memo' ? 3000 : 300);
  if (!validDate(d.trip.start) || !validDate(d.trip.end) || d.trip.end < d.trip.start || diffDays(d.trip.end,d.trip.start)>30) { d.trip.start=DEF().trip.start; d.trip.end=DEF().trip.end; }
  const array = x => Array.isArray(x) ? x.filter(isObj).slice(0,5000) : [];

  d.plan = recordMap(j.plan, l => array(l).filter(x=>txt(x.title,60).trim()).map(x=>({id:txt(x.id,80)||uid(),t:/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(x.t)?x.t:'',title:txt(x.title,60),note:txt(x.note),q:txt(x.q,80),cat:CATS.some(c=>c.k===x.cat)?x.cat:'etc',done:x.done===true})));
  d.theme=recordMap(j.theme,v=>txt(v,60)); d.seeded=j.seeded===true || Object.keys(d.plan).length>0;
  d.fav=Array.isArray(j.fav)?j.fav.filter(id=>PLACES.some(p=>p.id===id)):[];
  d.mine=array(j.mine).filter(x=>txt(x.name,60).trim()).map(x=>({id:txt(x.id,80)||uid(),name:txt(x.name,60),note:txt(x.note,300),u:/^https:\/\//.test(x.u||'')?txt(x.u,2000):''}));
  d.spend=array(j.spend).filter(x=>validDate(x.d)&&Number.isFinite(x.amt)&&x.amt>0&&x.amt<=1e12).map(x=>({id:txt(x.id,80)||uid(),d:x.d,amt:x.amt,cur:x.cur==='KRW'?'KRW':'VND',cat:SPCATS.some(c=>c.k===x.cat)?x.cat:'etc',memo:txt(x.memo,100),rate:Number.isFinite(x.rate)&&x.rate>1&&x.rate<100?x.rate:undefined}));

  if(isObj(j.rate)&&Number.isFinite(j.rate.v)&&j.rate.v>1&&j.rate.v<100) d.rate={v:j.rate.v,at:txt(j.rate.at,40),ts:Number.isFinite(j.rate.ts)?j.rate.ts:0,manual:j.rate.manual===true};
  // Freeze legacy entries at the loaded rate so later refreshes do not change totals.
  d.spend.forEach(x=>{if(!x.rate)x.rate=d.rate.v;});
  d.custom=array(j.custom).filter(x=>/^c[a-z0-9]+$/i.test(x.id||'')&&txt(x.text,100).trim()).map(x=>({id:x.id,text:txt(x.text,100)}));

async function loadRate(force) {
  if(ui.rateBusy)return false;
  if (!force && (S.rate.manual || Date.now() - (S.rate.ts || 0) < 6 * 3600e3)) return true;
  ui.rateBusy=true;const initialRate=S.rate;
  const set = (v, at) => { if(S.rate!==initialRate)return; S.rate = { v, at, ts: Date.now(), manual: false }; save(); };
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/KRW', {signal:AbortSignal.timeout(10000)})).json();
    if (!(j && j.rates && j.rates.VND > 0)) throw new Error('rate');
    set(j.rates.VND, ymd(TZ_KR));
  } catch (e) {
    try {
      const j = await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.min.json', {signal:AbortSignal.timeout(10000)})).json();
      if (!(j && j.krw && j.krw.vnd > 0)) throw new Error('rate');
      set(j.krw.vnd, j.date || ymd(TZ_KR));
    } catch (e2) { ui.rateBusy=false;return false; }
  }
  ui.rateBusy=false;
  if (ui.tab === 'home' || ui.tab === 'wallet') refreshView();
  return true;
}

function locate() {

    if (!navigator.geolocation) return rej();
    navigator.geolocation.getCurrentPosition(p => { ui.coords = { lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5) }; res(); }, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });

}

const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64 = s => { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    try { const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + b64(new Uint8Array(await new Response(st).arrayBuffer())); } catch (e) { }
  }
  return 'j' + b64(bytes);
}
async function unpack(s) {
  if(s.length>200000)throw new Error('too large');const bytes = unb64(s.slice(1));
  if (s[0] === 'z') { const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
  if(s[0]!=='j')throw new Error('bad');return JSON.parse(new TextDecoder().decode(bytes));
}
let incoming = null;
async function checkIncoming() {
  const m = location.hash.match(/^#d=(.+)$/); if (!m) return false;
  try {
    const j = await unpack(m[1]);
    if (!isObj(j) || !isObj(j.p)) throw new Error('bad');
    const cleaned=normalize({trip:j.t,plan:j.p,theme:j.h,fav:j.f,mine:j.m,seeded:true},true);j.t=cleaned.trip;j.p=cleaned.plan;j.h=cleaned.theme;j.f=cleaned.fav;j.m=cleaned.mine;
    incoming = j;
    const n = Object.values(j.p).reduce((a, l) => a + (Array.isArray(l) ? l.length : 0), 0);
    ask('받은 일정이 있어요', `가족이 보낸 일정 ${n}개를 이 휴대폰에 불러올까요? 지금 이 휴대폰에 있는 일정과 찜한 곳은 받은 내용으로 바뀌어요. 지출과 준비물 체크는 그대로예요.`, '받은 일정 불러오기', () => {
      const g = S.trip.guardian, memo=S.trip.memo;
      if (j.t) S.trip = {...j.t, guardian:g, memo};
      Object.values(j.p).forEach(l => Array.isArray(l) && l.forEach(x => { if (!/^\d\d:\d\d$/.test(x.t || '')) x.t = ''; }));
      S.plan = j.p; S.theme = j.h || {}; S.fav = Array.isArray(j.f) ? j.f : []; S.mine = Array.isArray(j.m) ? j.m : []; S.seeded = true;
      
      save(); ui.day = null; go('plan'); toast('받은 일정을 불러왔어요');
    });
  } catch (e) { toast('링크의 일정을 읽지 못했어요'); }
  try { history.replaceState(null, '', location.pathname + location.search + '#home'); } catch (e) { }
  return true;
}

/* ───────── 입력 처리 ───────── */
function onConv(from) {
  const a = $('#cv-vnd'), b = $('#cv-krw'); if (!a || !b) return;
  if (from === 'vnd') { const v = num(a.value); a.value = v ? nf(v) : ''; b.value = v ? nf(v / S.rate.v) : ''; }
  else { const k = num(b.value); b.value = k ? nf(k) : ''; a.value = k ? nf(k * S.rate.v) : ''; }
}
function spHint() {
  const i = $('#sp-amt'), h = $('#sp-hint'); if (!i || !h) return;
  const v = num(i.value); i.value = v ? nf(v) : '';
  h.textContent = !v ? '' : ui.spCur === 'VND' ? `약 ${nf(v / S.rate.v)}원` : `약 ${nf(v * S.rate.v)}동`;
}
const FORMS = {
  'f-picks':(f,d)=>{ui.pq=d.get('q').trim();renderMap();},
  'f-spend-edit':(f,d)=>{const x=S.spend.find(s=>s.id===f.dataset.id),amt=num(d.get('amt')),rate=num(d.get('rate'));if(!x)return;if(!(amt>0&&amt<=1e12&&rate>1&&rate<100&&validDate(d.get('d')))){toast('금액·환율·날짜를 확인해 주세요');return;}Object.assign(x,{amt,rate,d:d.get('d'),cur:d.get('cur'),cat:d.get('cat'),memo:d.get('memo').trim()});save();closeSheet();renderWallet();toast('지출을 수정했어요');},

    const it = { id: id || uid(), t: hh ? `${hh}:${d.get('mm')}` : '', title, note: d.get('note').trim(), q: d.get('q').trim(), cat: d.get('cat') || 'etc', done: false };
    if (id) { const old = (S.plan[from] || []).find(x => x.id === id); if (old) it.done = old.done; S.plan[from] = (S.plan[from] || []).filter(x => x.id !== id); }
    (S.plan[to] = S.plan[to] || []).push(it);

document.addEventListener('click', e => {
  if (e.target === sheet) { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { const result=fn(el,e);if(result?.catch)result.catch(()=>toast('요청을 완료하지 못했어요. 다시 시도해 주세요')); }
});
document.addEventListener('submit', e => { e.preventDefault(); const fn = FORMS[e.target.id]; if (fn) fn(e.target, new FormData(e.target)); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cv-vnd') onConv('vnd');
  else if (t.id === 'cv-krw') onConv('krw');
  else if (t.id === 'sp-amt') spHint();
  else if (t.name === 'v' && t.closest('#f-budget')) { const v = num(t.value); t.value = v ? nf(v) : ''; }
  else if (t.dataset.trip && t.type !== 'date') { S.trip[t.dataset.trip] = t.dataset.trip === 'code' ? t.value.toUpperCase() : t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ck) {
    if (t.checked) S.check[t.dataset.ck] = true; else delete S.check[t.dataset.ck];
    save(); t.closest('.ck').classList.toggle('on', t.checked);
    const ck = checkProgress(), n = $('#ck-n'), b = $('#ck-bar');
    if (n) n.textContent = `${ck.done} / ${ck.total}`; if (b) b.style.width = (ck.total ? ck.done / ck.total * 100 : 0) + '%';
  } else if (t.dataset.trip && t.type === 'date') {
    const k = t.dataset.trip, v = t.value; if (!v) { t.value = S.trip[k]; return; }
    const start = k === 'start' ? v : S.trip.start, end = k === 'end' ? v : S.trip.end;
    if (end < start) { toast('도착하는 날이 출발하는 날보다 빨라요'); t.value = S.trip[k]; return; }
    if (diffDays(end, start) > 30) { toast('여행 기간은 31일까지만 넣을 수 있어요'); t.value = S.trip[k]; return; }
    S.trip[k] = v; save(); ui.day = null; const outside=Object.keys(S.plan).filter(d=>!tripDays().includes(d)&&(S.plan[d]||[]).length);toast(outside.length?'날짜를 바꿨어요. 기간 밖 일정은 보관되고 날짜를 되돌리면 다시 보여요':'여행 날짜를 바꿨어요');
  } else if (t.id === 'imp' && t.files && t.files[0]) {
    if(t.files[0].size>2*1024*1024){toast('백업 파일은 2MB 이하로 선택하세요');t.value='';return;}
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const j = JSON.parse(fr.result);
        const cleaned=normalize(j,true);if(j.shareOnly===true){checkSharedFile(cleaned);return;}
        ask('백업을 불러올까요?', '이 휴대폰의 기록이 백업 파일의 내용으로 모두 바뀌어요.', '백업 불러오기', () => { S=cleaned;save();applyAppearance();ui.day=null;go('home');toast('백업을 불러왔어요'); });
      } catch (err) { toast('이 앱의 백업 파일이 아니에요'); }
    };
    fr.onerror=()=>toast('파일을 읽지 못했어요');
    fr.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', e => {
  const modal=!show.hidden?show:!sheet.hidden?sheetIn:null;
  if(e.key==='Escape'&&modal){e.preventDefault();if(!show.hidden)closeShow();else closeSheet();return;}
  if(e.key==='Tab'&&modal){const els=[...modal.querySelectorAll('a[href],button,input:not([type=hidden]),select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=els[0],last=els.at(-1);if(!first){e.preventDefault();modal.focus();}else if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
  if(!modal&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)&&e.target.matches('[role=tab]')){const tabs=[...e.target.parentNode.querySelectorAll('[role=tab]')];const i=tabs.indexOf(e.target),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const action=tabs[n].dataset.act,value=tabs[n].dataset.v;e.preventDefault();tabs[n].click();document.querySelector(`[data-act="${action}"][data-v="${value}"]`)?.focus();}
});
window.addEventListener('online',()=>{connection();loadWx();loadRate();});window.addEventListener('offline',connection);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDER[h] && h !== ui.tab) go(h); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadWx(); loadRate(); tick(); } });

/* ───────── 시작 ───────── */
let lastDay=ymd(TZ_VN);
function tick() { const a = $('#clk-vn'), b = $('#clk-kr'); if (a) a.textContent = hm(TZ_VN); if (b) b.textContent = hm(TZ_KR); }
function installMeta() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 192; const x = c.getContext('2d');
    x.fillStyle = '#0A5A66'; x.fillRect(0, 0, 192, 192);
    x.fillStyle = '#FFB81C'; x.beginPath(); x.arc(130, 68, 30, 0, 7); x.fill();
    x.strokeStyle = '#F3FBFA'; x.lineWidth = 12; x.lineCap = 'round';
    for (let i = 0; i < 2; i++) { const y = 122 + i * 30; x.beginPath(); x.moveTo(32, y); x.bezierCurveTo(58, y - 24, 78, y + 24, 100, y); x.bezierCurveTo(122, y - 24, 140, y + 20, 160, y - 2); x.stroke(); }
    const url = c.toDataURL('image/png');
    ['icon', 'apple-touch-icon'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; l.href = url; document.head.appendChild(l); });
    const base = location.href.split('#')[0];
    if (/^https?:/.test(base)) {
      const m = { name: '나트랑 가족여행', short_name: '나트랑', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#F0F6F4', theme_color: '#0A5A66', icons: [{ src: url, sizes: '192x192', type: 'image/png' }] };
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
    }
  } catch (e) { }
}
(async function boot() {
  applyAppearance();connection();
  if (!S.seeded) seedPlan();
  installMeta();
  const shared = await checkIncoming();
  const h = location.hash.slice(1);
  go(!shared && RENDER[h] ? h : 'home');
  setInterval(()=>{tick();const current=status().today;if(current!==lastDay){lastDay=current;refreshView();}},15000);
  try { speechSynthesis.getVoices(); } catch (e) { }
  loadWx(); loadRate();
})();

})();
</script>
