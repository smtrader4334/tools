<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>더함 브랜드 필름</title>
<style>
@font-face{font-family:P;font-weight:300;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Light.woff2) format('woff2')}
@font-face{font-family:P;font-weight:400;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:P;font-weight:500;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:P;font-weight:600;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2) format('woff2')}
@font-face{font-family:P;font-weight:700;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:P;font-weight:800;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraBold.woff2) format('woff2')}

/* 최신 홈페이지(theham-consult)의 색 체계 */
:root{
  --white:#F5F7FA;
  --muted:#A3AFBF;
  --dim:#6B7788;
  --blue:#285AF5;
  --blue-l:#7EA0FF;
  --navy:#101E30;
  --navy-d:#0A1422;
}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;font-family:P,sans-serif;color:var(--white)}
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
canvas.layer{display:block}
.blue{color:var(--blue-l)}
.ghost{opacity:0}

/* 오프닝·빌드업 문장 */
#phrase{display:flex;align-items:center;justify-content:center;pointer-events:none}
#phraseIn{font-weight:700;letter-spacing:-.035em;line-height:1.22;text-align:center;
  text-shadow:0 4px 30px rgba(0,0,0,.55),0 1px 6px rgba(0,0,0,.35)}
#phraseIn .w{display:inline-block;will-change:transform,opacity,filter}

/* 드롭 A 한 단어 */
#words{display:flex;align-items:center;justify-content:center;pointer-events:none}
#word{font-weight:800;letter-spacing:-.045em;line-height:1.08;text-align:center;white-space:nowrap;
  text-shadow:0 6px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);will-change:transform,opacity}

/* 폰 */
#phoneRig{visibility:hidden}
#phone{position:absolute;left:0;top:0;transform-origin:0 0;width:418px;height:872px;border-radius:64px;
  background:linear-gradient(145deg,#3a3d45,#0d0e12 40%,#1c1e24 70%,#3b3f48);
  box-shadow:0 60px 140px rgba(0,0,0,.6),0 0 0 1.5px rgba(255,255,255,.08) inset,0 0 90px rgba(40,90,245,.16)}
#screen{position:absolute;left:14px;top:14px;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#fff}
#statusbar{position:absolute;left:0;top:0;width:390px;height:50px;background:#fff;z-index:2}
.pg{position:absolute;left:0;top:50px;width:390px;height:794px;border:0;background:#fff;visibility:hidden}
#island{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:6}
#hl{position:absolute;display:none;border:3px solid var(--blue);border-radius:14px;
  box-shadow:0 0 0 2000px rgba(10,20,34,.22),0 0 22px rgba(40,90,245,.45);z-index:3;pointer-events:none}
#tap{position:absolute;display:none;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;z-index:4;
  background:radial-gradient(circle,rgba(255,255,255,.8) 0 36%,rgba(255,255,255,0) 40%)}
#tapRing{position:absolute;display:none;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;z-index:4;border:3px solid rgba(255,255,255,.9)}
#kw{position:absolute;font-weight:700;letter-spacing:-.035em;line-height:1.15;will-change:transform,opacity}
#kwSub{position:absolute;color:var(--muted);font-weight:500;letter-spacing:-.01em;line-height:1.5}

/* 엔딩 */
#endcard{display:none}
#logoWrap{position:absolute;left:50%;transform-origin:50% 50%}
#logo{display:block;width:100%;height:100%;filter:drop-shadow(0 0 28px rgba(201,168,76,.22))}
#logoSheen{position:absolute;inset:0;
  -webkit-mask:url(../assets/logo_gold.png) center/contain no-repeat;mask:url(../assets/logo_gold.png) center/contain no-repeat;
  background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,250,230,.9) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;mix-blend-mode:screen}
#tagline{position:absolute;left:0;width:100%;text-align:center;font-weight:800;letter-spacing:-.04em;white-space:nowrap;transform-origin:50% 50%}
#brandname{position:absolute;left:0;width:100%;text-align:center;font-weight:600;letter-spacing:.14em;white-space:nowrap}
#official{position:absolute;left:0;width:100%;text-align:center;color:var(--muted);font-weight:500;letter-spacing:.02em;white-space:nowrap}
#contacts{position:absolute;left:0;width:100%;text-align:center;color:#C9D2DE;font-weight:500;letter-spacing:.005em;line-height:1.7}
#contacts b{color:var(--white);font-weight:600}
#contacts .sep{color:#4A5668;margin:0 .9em}
#disclaimer{position:absolute;left:0;width:100%;text-align:center;color:var(--dim);font-weight:400;letter-spacing:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" class="layer"></canvas>
  <canvas id="c2" class="layer"></canvas>
  <div id="phoneRig" class="layer">
    <div id="phone">
      <div id="screen">
        <div id="statusbar"></div>
        <iframe class="pg" id="pg-home" src="../build/site/home.html" scrolling="no"></iframe>
        <iframe class="pg" id="pg-sm" src="../build/site/sm.html" scrolling="no"></iframe>
        <iframe class="pg" id="pg-dk" src="../build/site/dk.html" scrolling="no"></iframe>
        <div id="hl"></div>
        <div id="tapRing"></div>
        <div id="tap"></div>
        <div id="island"></div>
      </div>
    </div>
    <div id="kw"></div>
    <div id="kwSub"></div>
  </div>
  <div id="phrase" class="layer"><div id="phraseIn"></div></div>
  <div id="words" class="layer"><div id="word"></div></div>
  <div id="endcard" class="layer">
    <div id="logoWrap"><img id="logo" src="../assets/logo_gold.png" alt=""><div id="logoSheen"></div></div>
    <div id="brandname">더함화재특종손해사정</div>
    <div id="official">손해의 근거, 회복의 방향.</div>
    <div id="contacts"></div>
    <div id="disclaimer">보장 여부와 손해액은 보험계약 및 사고 내용에 따라 달라집니다.</div>
  </div>
  <div id="tagline"></div>
  <canvas id="fx" class="layer"></canvas>
</div>
<script type="module" src="film.js"></script>
</body>
</html>
